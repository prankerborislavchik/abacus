name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test

  desktop:
    name: Install (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-15
          - target: windows
            os: windows-2025
          - target: linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install Linux build, package and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev dpkg-dev xvfb xauth
      - name: Locate Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compilerDirectory = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          if (-not (Test-Path (Join-Path $compilerDirectory 'ISCC.exe'))) {
            throw 'Inno Setup 6 is required on this runner.'
          }
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Fetch, build, test, package, install and launch
        shell: bash
        env:
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}.git
          SOURCE_REF: ${{ github.sha }}
          CI_TARGET: ${{ matrix.target }}
        run: |
          bash scripts/ci.sh \
            --repository "$SOURCE_REPOSITORY" \
            --ref "$SOURCE_REF" \
            --target "$CI_TARGET" \
            --system-flutter \
            --work-dir "$RUNNER_TEMP/abacus-ci"
      - name: Save installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abacus-${{ matrix.target }}-installer
          path: ${{ runner.temp }}/abacus-ci/source/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Save evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abacus-${{ matrix.target }}-evidence
          path: ${{ runner.temp }}/abacus-ci/evidence/
          if-no-files-found: warn
          retention-days: 14
