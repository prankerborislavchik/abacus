name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      # The PR introducing the first tests adds flutter test here.

  desktop:
    name: Build (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-15
            archive_directory: build/macos/Build/Products/Release
            archive_entry: Abacus.app
          - target: windows
            os: windows-2025
            archive_directory: build/windows/x64/runner/Release
            archive_entry: .
          - target: linux
            os: ubuntu-24.04
            archive_directory: build/linux/x64/release/bundle
            archive_entry: .
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter pub get --enforce-lockfile
      - name: Build native application
        run: flutter build ${{ matrix.target }} --release
      - name: Archive application
        shell: bash
        run: tar -czf "abacus-${{ matrix.target }}.tar.gz" -C "${{ matrix.archive_directory }}" "${{ matrix.archive_entry }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abacus-${{ matrix.target }}
          path: abacus-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
